name: Fix FriendRow Kotlin calls

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-friendrow.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch AccountScreen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ng/name/gojodev/picnym/ui/screens/AccountScreen.kt')
          s = p.read_text()
          replacements = {
          '''FriendRow(profile, "Add") { scope.launch { runCatching { api.requestFriend(profile.username) }; results = results.filterNot { it.userId == profile.userId }; load() } } { onProfile(profile.username) }''': '''FriendRow(profile, "Add", onAction = { scope.launch { runCatching { api.requestFriend(profile.username) }; results = results.filterNot { it.userId == profile.userId }; load() } }, onOpen = { onProfile(profile.username) })''',
          '''FriendRow(entry.profile, "Accept") { scope.launch { runCatching { api.acceptFriend(entry.profile.userId) }; load() } } { onProfile(entry.profile.username) }''': '''FriendRow(entry.profile, "Accept", onAction = { scope.launch { runCatching { api.acceptFriend(entry.profile.userId) }; load() } }, onOpen = { onProfile(entry.profile.username) })''',
          '''FriendRow(entry.profile, "Cancel") { scope.launch { runCatching { api.removeFriend(entry.profile.userId) }; load() } } { onProfile(entry.profile.username) }''': '''FriendRow(entry.profile, "Cancel", onAction = { scope.launch { runCatching { api.removeFriend(entry.profile.userId) }; load() } }, onOpen = { onProfile(entry.profile.username) })''',
          '''FriendRow(entry.profile, "Remove") { scope.launch { runCatching { api.removeFriend(entry.profile.userId) }; load() } } { onProfile(entry.profile.username) }''': '''FriendRow(entry.profile, "Remove", onAction = { scope.launch { runCatching { api.removeFriend(entry.profile.userId) }; load() } }, onOpen = { onProfile(entry.profile.username) })'''
          }
          original = s
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected Kotlin fragment: {old[:60]}')
              s = s.replace(old, new)
          if s == original:
              raise SystemExit('No changes made')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ng/name/gojodev/picnym/ui/screens/AccountScreen.kt
          git commit -m "Fix FriendRow callback syntax"
          git push
